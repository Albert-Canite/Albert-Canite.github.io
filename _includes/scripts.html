<script>
  (function() {
    var productionHosts = [
      "www.zhicanzhou.com",
      "zhicanzhou.com",
      "albert-canite.github.io"
    ];

    if (productionHosts.indexOf(window.location.hostname) === -1) {
      return;
    }

    var isHomepage = window.location.pathname === "/" ||
      window.location.pathname === "/index.html";

    if (!isHomepage) {
      return;
    }

    var navigation = window.performance &&
      window.performance.getEntriesByType &&
      window.performance.getEntriesByType("navigation")[0];
    var isReload = navigation && navigation.type === "reload";
    var hasCountedHomepage = window.sessionStorage.getItem("homepage-visit-counted");
    var shouldIncrement = !hasCountedHomepage || isReload;
    var counterAction = shouldIncrement ? "hit" : "get";

    if (shouldIncrement) {
      window.sessionStorage.setItem("homepage-visit-counted", "true");
    }

    fetch("https://abacus.jasoncameron.dev/" + counterAction + "/zhicanzhou-com/site-total-visits", {
      cache: "no-store"
    })
      .then(function(response) {
        if (!response.ok) {
          throw new Error("Visit counter request failed");
        }
        return response.json();
      })
      .then(function(response) {
        var count = document.getElementById("site-visit-count");
        var message = document.getElementById("site-visit-message");
        var value = response && Number(response.value);

        if (count && message && Number.isFinite(value)) {
          count.textContent = (1367 + value).toLocaleString("en-US");
          message.classList.add("is-loaded");
        }
      })
      .catch(function() {
        // Keep the starting value visible if the counter service is unavailable.
      });
  }());
</script>
<script>
  $(function() {
    var $extraNews = $("#latest-news-extra");
    var $toggle = $("#latest-news-toggle");

    if (!$extraNews.length || !$toggle.length) {
      return;
    }

    $toggle.on("click", function() {
      $extraNews.removeAttr("hidden");
      $toggle.attr("aria-expanded", "true").hide();
    });
  });
</script>
